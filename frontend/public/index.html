<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WeCove.in — Modern Software & Digital Product Studio</title>
    <meta
      name="description"
      content="WeCove.in designs and develops websites, applications, SaaS platforms, and custom software for businesses ready to turn ideas into useful digital products."
    />
    <meta name="theme-color" content="#ffffff" />
    <meta property="og:title" content="WeCove.in — Modern Software & Digital Product Studio" />
    <meta
      property="og:description"
      content="Software built around your ambition. Websites, web applications, SaaS platforms, and custom software."
    />
    <meta property="og:type" content="website" />
    
    <!-- Google Fonts: Geist, Geist Mono, Inter, JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800;900&family=Geist+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Base styles and smooth rendering */
      html, body {
        background-color: #faf9f5;
        color: #090a0c;
        margin: 0;
        padding: 0;
        font-family: 'Geist', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      /* Custom clean scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #0f1013;
      }
      ::-webkit-scrollbar-thumb {
        background: #272a33;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #393e4d;
      }
    </style>
  </head>
  <body class="bg-[#faf9f5] text-[#090a0c] antialiased selection:bg-[#d2fc1e] selection:text-[#090a0c]">
    <div id="root"></div>
  </body>
</html>
